spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://127.0.0.1:1/proofchain
    username: test
    password: test
proofchain:
  jwt:
    # Test-scoped only. Every test context generates a fresh 48-byte secret: two `random.value` fragments are
    # 32 lowercase hexadecimal characters each, so the concatenation is valid standard Base64. No secret is
    # committed to the repository and no test secret can ever be reused by a running deployment.
    secret: ${random.value}${random.value}
    access-token-ttl: PT30M
  password:
    bcrypt-strength: 4
  storage:
    root: ${java.io.tmpdir}/proofchain-test-storage-${random.uuid}
    max-file-size: ${PROOFCHAIN_MAX_FILE_SIZE:50MB}
