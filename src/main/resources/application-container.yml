spring:
  config:
    activate:
      on-profile: container
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:proofchain}
    username: ${DB_USERNAME:proofchain}
    password: ${DB_PASSWORD:}
proofchain:
  storage:
    root: ${PROOFCHAIN_STORAGE_ROOT:/var/lib/proofchain/storage}
