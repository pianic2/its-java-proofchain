name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply formatter for diagnostic
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply

      - name: Capture formatter patch
        run: git diff --binary > formatted.patch

      - name: Verify quality gate
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > diagnostic.log 2>&1
          status=$?
          cat diagnostic.log
          exit $status

      - name: Upload diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ijpc-136-diagnostic
          path: |
            formatted.patch
            diagnostic.log
          retention-days: 1
          if-no-files-found: error

      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Failsafe reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7
          if-no-files-found: warn
